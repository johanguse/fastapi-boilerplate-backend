app = "fastapi-boilerplate-backend-staging"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile.prod"

[deploy]
strategy = "rolling"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop' # on, off, stop - stop is the default and will stop the machines after 10 minutes of inactivity. In production change it to 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  hard_limit = 50
  soft_limit = 40

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
