app = "fastapi-boilerplate-backend-prod"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile.prod"

[deploy]
strategy = "rolling"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = '30s'
  timeout = '20s'
  grace_period = '60s'
  method = 'GET'
  path = '/api/v1/health'

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024