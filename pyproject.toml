[project]
name = "boilerplate-backend"
version = "1.1.0"
description = "AI-Powered SaaS Boilerplate Backend"
authors = [{ name = "Johan Guse", email = "johanguse@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
  "fastapi[standard]>=0.127.0",
  "fastapi-users[oauth,sqlalchemy]>=15.0.3",
  "fastapi-pagination[sqlalchemy]>=0.15.4",
  "sqlalchemy>=2.0.45",
  "psycopg2-binary>=2.9.11",
  "pydantic[email]>=2.12.5",
  "alembic>=1.17.2",
  "uvicorn>=0.40.0",
  "pyjwt[crypto]>=2.10.1",
  "passlib[argon2]>=1.7.4",
  "bcrypt>=4.0.0,<5.0.0",
  "python-dotenv>=1.2.2",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.31",
  "pandas>=2.3.3",
  "chardet>=5.2.0",
  "celery>=5.6.0",
  "resend>=2.19.0",
  "asyncpg>=0.31.0",
  "boto3>=1.42.14",
  "httpx-oauth>=0.16.1",
  "sqlalchemy-utils>=0.42.1",
  "loguru>=0.7.3",
  "python-json-logger>=4.0.0",
  "ua-parser>=1.0.1",
  "user-agents>=2.2.0",
  "python-terraform>=0.10.1",
  "cachetools>=6.2.4",
  "stripe>=14.1.0",
  "cryptography>=48.0.1",
  "python-magic>=0.4.27",
  "babel>=2.17.0",
  "uvloop>=0.22.1",
  "httptools>=0.7.1",
  "orjson>=3.11.6",
  "slowapi>=0.1.9",
  "openai>=2.14.0",
  "anthropic>=0.75.0",
  "tiktoken>=0.12.0",
  "pypdf>=6.13.3",
  "python-docx>=1.2.0",
  "langchain-core>=1.3.3",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.10",
  "httpx>=0.28.1",
  "testcontainers>=4.13.3",
  "factory-boy>=3.3.3",
  "pytest-asyncio>=1.3.0",
  "aiosqlite>=0.22.0",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = [
  "E203",
  "E501",
  "PLC0415",
  "PLR0913",
  "PLR0917",
  "PLR6301", # Method could be static - ignore for flexibility
  "PLR2004", # Magic values - acceptable in many cases
  "PLR0914", # Too many local variables
  "PLR0911", # Too many return statements
  "PLW2901", # Loop variable overwritten - common pattern
]

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.ruff.lint.per-file-ignores]
"src/activity_log/service.py" = ["PLC0415"]
"src/auth/user_routes.py" = ["PT028"] # Test endpoints in API routes
"tests/**/*.py" = [
  "PLR2004",
  "PLR6301",
] # Allow magic values and non-static methods in tests
"scripts/**/*.py" = [
  "PLR2004",
  "PLR0912",
  "PLR0914",
  "PLR0915",
] # Allow magic values and complexity in scripts

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.coverage.run]
omit = ["src/teams/*"]
